<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Universal Bounty Swarm</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect script for HashRouter
      // Redirects non-root URLs to index.html with appropriate hash fragment
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var newPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        (pathSegmentsToKeep > 0 ? '/' + l.pathname.slice(1).split('/').slice(0, pathSegmentsToKeep).join('/') : '') +
        '/?/' + newPath.replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body style="background-color: #020408; color: #00F0FF; font-family: monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <h1 style="font-size: 2rem; margin-bottom: 1rem;">Redirecting to Swarm Hub...</h1>
      <p style="color: #94a3b8;">If you are not redirected automatically, <a href="./" style="color: #D4FF00;">click here</a>.</p>
    </div>
  </body>
</html>
